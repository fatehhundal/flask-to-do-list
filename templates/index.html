<!DOCTYPE html>
<html>
    <head>
        <title>To Do App</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="container">
            <h1>To Do List</h1>

            <form action="/add" method="POST">
                <input type="text" name="task" placeholder="Enter task">
                <button>Add</button>
            </form>

            <ul>
                {% for task in tasks %}
                <li>
                    {{ task }}
                    <a href="/delete/{{ loop.index0 }}">Delete</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </body>
</html>
